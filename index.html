<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Resources</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 28px;
    }
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .kiosk-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 20px;
      background-color: #1e3a8a;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: 6px;
      border: 2px solid transparent;
      text-align: center;
    }
    .kiosk-link:hover {
      background-color: #1d4ed8;
    }
    .kiosk-link:focus-visible {
      outline: 4px solid #f59e0b;
      outline-offset: 3px;
      background-color: #1d4ed8;
    }
    .instructions {
      background-color: #f8fafc;
      border-left: 4px solid #0284c7;
      padding: 16px 20px;
      border-radius: 0 6px 6px 0;
      font-size: 0.95rem;
      color: #334155;
    }
    .instructions p {
      margin-bottom: 8px;
    }
    .instructions p:last-child {
      margin-bottom: 0;
    }
    .instructions strong {
      color: #0f172a;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Employee Resources</h1>
    <nav class="link-list" aria-label="Employee resource sites">
      <a class="kiosk-link" href="https://www.teamsaharalv.com/" target="_blank" rel="noopener">Team Sahara</a>
      <a class="kiosk-link" href="https://thesource.plansource.com/meruelogroup" target="_blank" rel="noopener">The Source</a>
      <a class="kiosk-link" href="https://lasvegasresort.prd.mykronos.com/" target="_blank" rel="noopener">UKG</a>
    </nav>
    <section class="instructions" aria-label="Session guidance">
      <p><strong>Notice:</strong> When finished, use Edge’s End session button. After 2 minutes without activity, all kiosk tabs will close and this screen will reopen.</p>
      <p>Returning to this selector screen or closing an individual tab does not end your active session.</p>
    </section>
  </main>
</body>
</html>
